[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strathive"
version = "0.1.0"
description = "A local strategy-run ledger"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "platformdirs>=4,<5",
  "rich>=13,<16",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<0.20",
  "click>=8.2,<9",
]

[project.scripts]
strathive = "strathive.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pyinstaller>=6.20,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
